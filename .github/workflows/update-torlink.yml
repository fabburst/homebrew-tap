name: Update torlink formula

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check for new torlink-macos release
        id: check
        run: |
          LATEST=$(curl -s https://api.github.com/repos/fabburst/torlink-macos/releases/latest | jq -r '.tag_name')
          VERSION=$(echo "$LATEST" | sed 's/-mac$//' | sed 's/^v//')
          CURRENT=$(grep 'version "' Formula/torlink.rb | sed 's/.*version "//;s/".*//')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          if [ "$VERSION" = "$CURRENT" ]; then
            echo "new=false" >> $GITHUB_OUTPUT
          else
            echo "new=true" >> $GITHUB_OUTPUT
          fi

      - name: Compute SHA256 of new binary
        if: steps.check.outputs.new == 'true'
        id: sha
        run: |
          curl -sL "https://github.com/fabburst/torlink-macos/releases/latest/download/torlink-macos-arm64" -o /tmp/torlink-macos-arm64
          echo "sha256=$(sha256sum /tmp/torlink-macos-arm64 | cut -d' ' -f1)" >> $GITHUB_OUTPUT

      - name: Update formula
        if: steps.check.outputs.new == 'true'
        run: |
          sed -i "s/sha256 \".*\"/sha256 \"${{ steps.sha.outputs.sha256 }}\"/" Formula/torlink.rb
          sed -i "s/version \".*\"/version \"${{ steps.check.outputs.version }}\"/" Formula/torlink.rb

      - name: Commit and push
        if: steps.check.outputs.new == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/torlink.rb
          git commit -m "chore: update torlink to v${{ steps.check.outputs.version }}"
          git push
